name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    name: Seguridad (Ruby)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    name: Seguridad (JavaScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    name: Estilo
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Los tests de contrato corren ffprobe, y ffmpeg decodifica las tapas para
      # sacarles el color. Los runners de Ubuntu no traen el paquete, y bajarlo
      # tardaba más que correr la suite entera: 31s de apt para 9s de tests. Se
      # baja una vez y se guarda; después es descomprimir.
      - name: Install ffmpeg
        uses: ./.github/actions/ffmpeg

      # Los tests nunca tocan el NAS: Beets::Library corre contra fixtures de
      # SQLite que se arman en el momento, y MEDIA_ROOT apunta a un puñado de
      # FLACs falsos en test/fixtures/media.
      - name: Run tests
        env:
          RAILS_ENV: test
          # Sin esto, un runner sin ffprobe saltearía los tests de contrato en
          # silencio y la suite quedaría verde sin haberlos corrido.
          REQUIRE_FFPROBE: "1"
        run: bin/rails db:test:prepare test

  # Un browser por test es lo más caro que hace esta suite, y no se puede hacer
  # más barato: se puede hacer en paralelo. Los archivos se reparten entre tres
  # runners de mayor a menor, así los dos grandes —el visualizador y el player—
  # caen en máquinas distintas en vez de hacer cola en la misma.
  system_test:
    name: Tests de sistema (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest

    strategy:
      # Un shard que falla no dice nada de los otros dos, y querés ver los tres.
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Los system tests recorren la cadena entera del color: la tapa se decodifica
      # con ffmpeg en el server y el browser solo aplica lo que recibe.
      - name: Install ffmpeg
        uses: ./.github/actions/ffmpeg

      # `test:system` corre el directorio entero, así que el shard se arma a mano.
      # tailwindcss:build va explícito: sin la hoja de estilos el browser no
      # aplica ningún text-transform, y los tests que leen el texto de la pantalla
      # fallan por mayúsculas — un rojo que no tiene nada que ver con el código.
      - name: Run system tests
        env:
          RAILS_ENV: test
        run: |
          files=$(wc -l test/system/*_test.rb | grep -v ' total$' | sort -rn |
                    awk '{ print $2 }' | awk "NR % 3 == ${{ matrix.shard }} % 3")
          test -n "$files" || { echo "este shard no agarró ningún archivo"; exit 1; }
          echo "$files"
          bin/rails tailwindcss:build
          bin/rails db:test:prepare
          echo "$files" | xargs bin/rails test

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots-${{ matrix.shard }}
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # La imagen es el artefacto que corre en el NAS. Si el Dockerfile se rompe, un
  # deploy no es el momento de enterarse. El NAS es amd64 y no hay build de
  # producción en ningún otro lado, así que se buildea para esa plataforma.
  docker:
    name: Imagen Docker (amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: mediateca:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Un build que compila pero no arranca no sirve de nada. La imagen tiene
      # que levantar y contestar el healthcheck que kamal-proxy va a consultar.
      - name: Boot the image and check /up
        run: |
          docker run -d --name mediateca-ci \
            -e RAILS_ENV=production \
            -e SECRET_KEY_BASE=$(openssl rand -hex 32) \
            -e SOLID_QUEUE_IN_PUMA=true \
            -p 8080:80 \
            mediateca:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/up > /dev/null 2>&1; then
              echo "✓ /up contestó al intento $attempt"
              exit 0
            fi
            sleep 2
          done

          echo "✗ /up nunca contestó; logs del contenedor:"
          docker logs mediateca-ci
          exit 1

  # Un push a main que pasó todo lo de arriba se publica solo. El runner
  # self-hosted vive en el propio NAS: buildea nativo (amd64) y kamal entra por
  # SSH a sí mismo, así que nada de esto sale de la LAN. La master key se queda
  # en el NAS (~/mediateca-ci/master.key), nunca en GitHub.
  deploy:
    name: Deploy (NAS)
    needs: [ scan_ruby, scan_js, lint, test, system_test, docker ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [ self-hosted, nas ]

    # Para pushear el tag de la versión que este cambio se ganó.
    permissions:
      contents: write

    steps:
      # fetch-depth: 0 trae los tags, y el tag ES la versión: kamal lo lee con
      # `git describe` y lo hornea en la imagen. Un checkout shallow no tiene
      # tags, y la app se quedaría sin número que mostrar.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # El tag se corta ANTES del deploy porque el deploy lo hornea: kamal lee
      # `git describe` para pasarle la versión a la imagen. Se crea local nomás;
      # se publica recién si el deploy salió bien (último paso), así que un build
      # que falla no deja un tag prometiendo algo que nunca estuvo vivo.
      #
      # Quién decide el salto: lib/next_version.rb, leyendo el conventional commit.
      - name: Cut the version this change earns
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG=$(ruby script/next-version)
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
            || git tag -a "$TAG" -m "$(git log -1 --pretty=%s)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "$(git log -1 --pretty=%s)  ->  $TAG"

      # El repo es público, así que ni la key ni las coordenadas del deploy —
      # dónde vive el server, quién sos ahí, dónde está la música — están en el
      # checkout: config/master.key, .kamal/secrets y .kamal/deploy.env están
      # gitignoreados. Salen de la copia local del NAS; secrets son solo lookups
      # (RAILS_MASTER_KEY=$(cat config/master.key)).
      - name: Provide the deploy's coordinates and secrets from the NAS
        run: |
          cp "$HOME/mediateca-ci/master.key" config/master.key
          cp "$HOME/mediateca-ci/deploy.env" .kamal/deploy.env
          cp .kamal/secrets.example .kamal/secrets
          # El certificado, si esta máquina tiene uno. .kamal/secrets lo lee de
          # acá y Kamal se lo pasa al proxy. Si no hay, las dos variables quedan
          # vacías y el deploy es el HTTP de siempre — salvo que deploy.env sí
          # declare MEDIATECA_TLS_HOST, y entonces Kamal para el deploy diciendo
          # que falta el certificado, que es exactamente lo que uno querría oír.
          mkdir -p .kamal/tls
          cp "$HOME"/mediateca-ci/tls/*.pem .kamal/tls/ 2>/dev/null || true
          chmod 600 .kamal/tls/*.pem 2>/dev/null || true

      # buildkit (driver docker-container) NO hereda el insecure-registries del
      # daemon, así que el builder que kamal reutiliza necesita su propio config
      # marcando el registry de la LAN como http. Lo recreamos en cada corrida
      # para que sobreviva a que kamal o un prune lo borren: si no, el push del
      # build reintenta por HTTPS contra un registry HTTP y muere.
      - name: Point the buildx builder at the LAN registry over HTTP
        run: |
          set -a; . .kamal/deploy.env; set +a
          printf '[registry."%s"]\n  http = true\n' "${MEDIATECA_REGISTRY:-$MEDIATECA_HOST:5555}" \
            > /tmp/mediateca-buildkitd.toml
          docker buildx rm kamal-local-docker-container 2>/dev/null || true
          docker buildx create --name kamal-local-docker-container \
            --driver docker-container --driver-opt network=host \
            --buildkitd-config /tmp/mediateca-buildkitd.toml

      # kamal es el gem del sistema (Ruby 3.3), no bin/kamal, que por bundler
      # pediría el Ruby 4.0.5 de la app. Y como no es bin/kamal, nadie carga
      # deploy.env por él: lo exportamos acá. C.UTF-8 le da a git mensajes en
      # inglés (para que no re-clone en cada deploy) sin forzar US-ASCII, que en
      # Ruby 3.3 rompe a SSHKit al leer output con bytes no-ASCII.
      - name: Deploy with Kamal
        env:
          LC_ALL: C.UTF-8
        run: |
          set -a; . .kamal/deploy.env; set +a
          kamal deploy

      # Recién ahora: el tag nombra un build que está vivo y sirviendo. Publicarlo
      # antes habría dejado una versión anunciada que un deploy fallido nunca puso
      # en el aire.
      - name: Publish the tag, now that the build it names is live
        run: git push origin "${{ steps.version.outputs.tag }}"
