name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    name: Seguridad (Ruby)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    name: Seguridad (JavaScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    name: Estilo
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Los tests nunca tocan el NAS: Beets::Library corre contra fixtures de
      # SQLite que se arman en el momento, y MEDIA_ROOT apunta a un puñado de
      # FLACs falsos en test/fixtures/media.
      - name: Run tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test

  # La imagen es el artefacto que corre en el NAS. Si el Dockerfile se rompe, un
  # deploy no es el momento de enterarse. El NAS es amd64 y no hay build de
  # producción en ningún otro lado, así que se buildea para esa plataforma.
  docker:
    name: Imagen Docker (amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: mediateca:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Un build que compila pero no arranca no sirve de nada. La imagen tiene
      # que levantar y contestar el healthcheck que kamal-proxy va a consultar.
      - name: Boot the image and check /up
        run: |
          docker run -d --name mediateca-ci \
            -e RAILS_ENV=production \
            -e SECRET_KEY_BASE=$(openssl rand -hex 32) \
            -e SOLID_QUEUE_IN_PUMA=true \
            -p 8080:80 \
            mediateca:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/up > /dev/null 2>&1; then
              echo "✓ /up contestó al intento $attempt"
              exit 0
            fi
            sleep 2
          done

          echo "✗ /up nunca contestó; logs del contenedor:"
          docker logs mediateca-ci
          exit 1
