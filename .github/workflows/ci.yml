name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    name: Seguridad (Ruby)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    name: Seguridad (JavaScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    name: Estilo
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Solo los tests de contrato corren ffmpeg; el resto de la suite anda sin
      # él. Los runners de Ubuntu no lo traen, y acá sí lo queremos: es el único
      # lugar donde se verifica que ffprobe siga hablando como cuando grabamos
      # su salida.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      # Los tests nunca tocan el NAS: Beets::Library corre contra fixtures de
      # SQLite que se arman en el momento, y MEDIA_ROOT apunta a un puñado de
      # FLACs falsos en test/fixtures/media.
      - name: Run tests
        env:
          RAILS_ENV: test
          # Sin esto, un runner sin ffmpeg saltearía los tests de contrato en
          # silencio y la suite quedaría verde sin haberlos corrido.
          REQUIRE_FFMPEG: "1"
        run: bin/rails db:test:prepare test

  system_test:
    name: Tests de sistema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run system tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # La imagen es el artefacto que corre en el NAS. Si el Dockerfile se rompe, un
  # deploy no es el momento de enterarse. El NAS es amd64 y no hay build de
  # producción en ningún otro lado, así que se buildea para esa plataforma.
  docker:
    name: Imagen Docker (amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: mediateca:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Un build que compila pero no arranca no sirve de nada. La imagen tiene
      # que levantar y contestar el healthcheck que kamal-proxy va a consultar.
      - name: Boot the image and check /up
        run: |
          docker run -d --name mediateca-ci \
            -e RAILS_ENV=production \
            -e SECRET_KEY_BASE=$(openssl rand -hex 32) \
            -e SOLID_QUEUE_IN_PUMA=true \
            -p 8080:80 \
            mediateca:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/up > /dev/null 2>&1; then
              echo "✓ /up contestó al intento $attempt"
              exit 0
            fi
            sleep 2
          done

          echo "✗ /up nunca contestó; logs del contenedor:"
          docker logs mediateca-ci
          exit 1

  # Un push a main que pasó todo lo de arriba se publica solo. El runner
  # self-hosted vive en el propio NAS: buildea nativo (amd64) y kamal entra por
  # SSH a sí mismo, así que nada de esto sale de la LAN. La master key se queda
  # en el NAS (~/mediateca-ci/master.key), nunca en GitHub.
  deploy:
    name: Deploy (NAS)
    needs: [ scan_ruby, scan_js, lint, test, system_test, docker ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [ self-hosted, nas ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # config/master.key y .kamal/secrets están gitignoreados: no vienen en el
      # checkout. La key sale de la copia local del NAS; secrets son solo
      # lookups (RAILS_MASTER_KEY=$(cat config/master.key)).
      - name: Provide secrets from the NAS
        run: |
          cp /home/gaston/mediateca-ci/master.key config/master.key
          cp .kamal/secrets.example .kamal/secrets

      # buildkit (driver docker-container) NO hereda el insecure-registries del
      # daemon, así que el builder que kamal reutiliza necesita su propio config
      # marcando el registry de la LAN como http. Lo recreamos en cada corrida
      # para que sobreviva a que kamal o un prune lo borren: si no, el push del
      # build reintenta por HTTPS contra un registry HTTP y muere.
      - name: Point the buildx builder at the LAN registry over HTTP
        run: |
          printf '[registry."192.168.1.7:5555"]\n  http = true\n' > /tmp/mediateca-buildkitd.toml
          docker buildx rm kamal-local-docker-container 2>/dev/null || true
          docker buildx create --name kamal-local-docker-container \
            --driver docker-container --driver-opt network=host \
            --buildkitd-config /tmp/mediateca-buildkitd.toml

      # kamal es el gem del sistema (Ruby 3.3), no bin/kamal, que por bundler
      # pediría el Ruby 4.0.5 de la app. C.UTF-8 le da a git mensajes en inglés
      # (para que no re-clone en cada deploy) sin forzar US-ASCII, que en Ruby
      # 3.3 rompe a SSHKit al leer output con bytes no-ASCII.
      - name: Deploy with Kamal
        env:
          LC_ALL: C.UTF-8
        run: kamal deploy
