# Mediateca runs on the home NAS, on the LAN, with no certificate.
#
# It replaces Jellyfin, which stays alive on :8096 in the meantime. kamal-proxy
# claims the host's :80 — that's why nginx is turned off.
service: mediateca
image: gstn-caruso/mediateca

servers:
  web:
    - 192.168.1.7

proxy:
  # LAN by hostname, no public DNS: there's no certificate to terminate.
  ssl: false
  # Thruster listens on 80 inside the container.
  app_port: 80
  healthcheck:
    path: /up

# Local registry: Kamal spins up a `registry:3` on this machine and opens a
# reverse SSH port-forward so the NAS can pull from its own localhost. There's
# no token to store and no private image floating around the internet — the
# image never leaves the LAN. With a server that starts with "localhost",
# Kamal doesn't even try to do a docker login.
#
# 5000 does NOT work on macOS: the AirPlay receiver (ControlCenter) listens on
# *:5000 over both IPv4 and IPv6, and since localhost resolves to ::1 first,
# the push ends up talking to AirTunes, which answers with 403.
registry:
  server: localhost:5555

# The NAS is amd64 and the Mac is arm64. Building on the NAS is native;
# cross-compiling with QEMU from the Mac works but is much slower.
builder:
  arch: amd64
  remote: ssh://gaston@192.168.1.7

# root over SSH is denied on the NAS; gaston is in the docker group.
ssh:
  user: gaston

env:
  clear:
    MEDIA_ROOT: /mnt/data/multimedia
    BEETS_DATABASE: /mnt/data/beets/musiclibrary.db
    # Single process: the NAS has 8 cores and there's no concurrency to spread.
    SOLID_QUEUE_IN_PUMA: true
  secret:
    - RAILS_MASTER_KEY

# Music is mounted read-only under the SAME path as on the host, so a path
# stored in the catalog means the same thing inside and outside the container.
# The container runs as uid 1000, which on the NAS is gaston, the owner of the
# files.
volumes:
  - "/mnt/data/multimedia:/mnt/data/multimedia:ro"
  - "/mnt/data/beets/musiclibrary.db:/mnt/data/beets/musiclibrary.db:ro"
  - "mediateca_storage:/rails/storage"

aliases:
  import: app exec --reuse "bin/rails music:import"
  console: app exec --interactive --reuse "bin/rails console"
  logs: app logs -f
