<%#
  Mediateca deploys to one machine on your own network — a NAS, a mini PC, an
  old laptop — over SSH, with no certificate and no public DNS.

  Nothing about that machine is written down here. Where it lives, who you are
  on it, and where the music sits are yours, not the project's, so they arrive
  from the environment: copy `.kamal/deploy.env.example` to `.kamal/deploy.env`
  and fill it in. `bin/kamal` loads that file before handing over to Kamal.

  A missing value stops the deploy and names what is missing. The ones that
  matter have no default on purpose: a deploy that guessed the host would SSH
  into whatever machine answers at that address on *your* network, and a deploy
  that guessed the music directory would mount the wrong disk.
%>
<%
  def deploy_env(name)
    value = ENV[name].to_s.strip
    raise "#{name} is not set. Copy .kamal/deploy.env.example to .kamal/deploy.env and fill it in — bin/kamal reads it, and nothing in it is committed." if value.empty?
    value
  end

  def optional_env(name)
    value = ENV[name].to_s.strip
    value.empty? ? nil : value
  end

  host       = deploy_env("MEDIATECA_HOST")
  ssh_user   = deploy_env("MEDIATECA_SSH_USER")
  media_root = deploy_env("MEDIATECA_MEDIA_ROOT")
  music_root = optional_env("MEDIATECA_MUSIC_ROOT") || media_root
  beets      = optional_env("MEDIATECA_BEETS_DATABASE")
  registry   = optional_env("MEDIATECA_REGISTRY") || "#{host}:5555"
  # The name on the certificate, when there is one — and the whole switch for
  # HTTPS. See the proxy block below, and "Install it as an app" in the README.
  tls_host   = optional_env("MEDIATECA_TLS_HOST")

  # The optional company the app keeps. Each of these is a feature that simply is
  # not there without it — and a deploy must never fall over because somebody has
  # not got round to Spotify yet. So a missing one is a line that is not written,
  # rather than a key with nothing after it, which is what Kamal refuses.
  spotify_id = optional_env("SPOTIFY_CLIENT_ID")
  qbittorrent = optional_env("QBITTORRENT_URL")
  lastfm     = optional_env("LASTFM_API_KEY")
%>
service: mediateca
image: <%= optional_env("MEDIATECA_IMAGE") || "mediateca" %>

servers:
  web:
    - <%= host %>

proxy:
<% if tls_host %>
  # A certificate was handed in, so this deploy speaks HTTPS. Not for secrecy —
  # there is nobody to hide the music from on your own LAN, and no password to
  # steal — but because a browser hands out the things an *app* is made of, the
  # service worker above all, only to a page it considers secure. Without a
  # certificate Mediateca can still be added to the Dock; with one, it can be
  # installed, and can answer for itself when the server is gone.
  #
  # The certificate is issued by a CA of your own that this machine's browsers
  # trust — see the README. Let's Encrypt is not in play: there is no public name
  # here to prove, and no proving it from the outside.
  #
  # kamal-proxy now claims :443 as well as :80, redirects one to the other, and
  # routes by name: after this the app answers to <%= tls_host %>, and no longer to
  # a bare IP — which is the point. The name is what the certificate is for.
  host: <%= tls_host %>
  ssl:
    certificate_pem: MEDIATECA_TLS_CERT
    private_key_pem: MEDIATECA_TLS_KEY
<% else %>
  # Reached by address on the LAN, with no public name: there is no certificate
  # to terminate. kamal-proxy claims the host's :80, so nothing else may hold it.
  #
  # Mediateca works perfectly well like this, and Safari will still put it in the
  # Dock. What plain HTTP cannot have is a service worker: a browser refuses one
  # to any page it doesn't consider secure. Set MEDIATECA_TLS_HOST to change that.
  ssl: false
<% end %>
  # Thruster listens on 80 inside the container.
  app_port: 80
  healthcheck:
    path: /up

# The registry runs on the server itself. The image is built there and pulled
# from there, so it never leaves the house — no token to store, no private image
# on anybody's internet. It has no real auth: on a home LAN anybody can already
# be anybody, so the password below is a formality Kamal insists on for a
# non-`localhost` server, and the daemon is told to trust it over plain HTTP
# through `insecure-registries` in /etc/docker/daemon.json.
#
# Why a registry on the server and not `localhost` on the deployer: when the
# thing that deploys IS the server — a CI runner living on the NAS — Kamal's
# localhost registry opens a reverse SSH forward that binds the registry port on
# the server, the very port its own registry already holds, and the deploy dies.
# A registry addressed by the server's own LAN address sidesteps the forward.
registry:
  server: <%= registry %>
  username: kamal
  password:
    - KAMAL_REGISTRY_PASSWORD

# Build on the server, natively. Cross-compiling to it from an arm64 Mac with
# QEMU works, and is much slower.
builder:
  arch: <%= optional_env("MEDIATECA_ARCH") || "amd64" %>
  remote: ssh://<%= ssh_user %>@<%= host %>
  # The version the app shows is the tag this deploy was cut from, read here —
  # where there is still a git clone to read it from — and baked into the image.
  # An untagged checkout hands in nothing, and the app shows no version.
  args:
    VERSION: <%= `git describe --tags --abbrev=0 2>/dev/null`.strip %>

# root over SSH is denied on most NAS boxes. This user has to be in the docker
# group, and has to be able to read the music.
ssh:
  user: <%= ssh_user %>

env:
  clear:
    # The trust boundary: no request may name a file outside this directory.
    MEDIA_ROOT: <%= media_root %>
    # Where the scan goes looking for music — often a subdirectory of the media
    # root, when the same disk also holds things that are not music.
    MUSIC_ROOT: <%= music_root %>
<% if tls_host %>
    # TLS ends at the proxy, so what reaches Rails is plain HTTP and Rails would
    # write plain-HTTP URLs into an HTTPS page — the <audio> src among them, which
    # the browser would then refuse as mixed content, and the music would simply
    # not play. This is how it knows better. See config/environments/production.rb.
    TLS_HOST: <%= tls_host %>
<% end %>
<% if beets %>
    # beets is an optional guest. Without it the library is still the library.
    BEETS_DATABASE: <%= beets %>
<% end %>
    # Single process: there is no concurrency here worth spreading over more.
    SOLID_QUEUE_IN_PUMA: true

<% if spotify_id %>
    # Spotify's client id, so a listener can bring home the songs they hearted
    # there and the lists they made. It sits in the clear on purpose: the sign-in
    # is PKCE, whose whole point is that a public client has no secret to keep —
    # and this one is handed to every browser that starts the journey anyway.
    SPOTIFY_CLIENT_ID: <%= spotify_id %>
<% end %>
<% if qbittorrent %>
    # The house's torrent client, which is on the NAS too — reached across the
    # bridge the app itself is on, not over the LAN. It lets that network in
    # without a password and asks everybody else for one, which is the same bargain
    # the app strikes and is written down in SECURITY.md.
    #
    # What it finds goes straight onto the shelf it would have stood on: the scan
    # reads a record as the directory two levels under the root, so that is the
    # shape it is given. Partial downloads live somewhere else entirely — a scan
    # that met a half-written FLAC would file half a record.
    QBITTORRENT_URL: <%= qbittorrent %>
    QBITTORRENT_INTO: <%= music_root %>
<% end %>
  secret:
    - RAILS_MASTER_KEY
<% if lastfm %>
    # Last.fm. Without these there is no Last.fm in the app at all: no menu item,
    # no scrobbles, no import.
    - LASTFM_API_KEY
    - LASTFM_API_SECRET
<% end %>

# The music is mounted read-only, and under the SAME path as on the host, so a
# path stored in the catalog means the same thing inside and outside the
# container. The container runs as uid 1000; that has to be somebody who can
# read the files.
volumes:
  - "<%= media_root %>:<%= media_root %>:ro"
<% if beets %>
  - "<%= beets %>:<%= beets %>:ro"
<% end %>
  - "mediateca_storage:/rails/storage"

aliases:
  import: app exec --reuse "bin/rails music:import"
  console: app exec --interactive --reuse "bin/rails console"
  logs: app logs -f
