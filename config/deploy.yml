# Mediateca runs on the home NAS, on the LAN, with no certificate.
#
# It replaces Jellyfin, which stays alive on :8096 in the meantime. kamal-proxy
# claims the host's :80 — that's why nginx is turned off.
service: mediateca
image: gstn-caruso/mediateca

servers:
  web:
    - 192.168.1.7

proxy:
  # LAN by hostname, no public DNS: there's no certificate to terminate.
  ssl: false
  # Thruster listens on 80 inside the container.
  app_port: 80
  healthcheck:
    path: /up

# The registry runs on the NAS itself, on the LAN. The image is built on the NAS
# and pulled by the NAS, so it never leaves the house — no token to store, no
# private image on anyone's internet. It has no real auth: on this LAN anybody
# can already be anybody, so the credentials below are a formality Kamal insists
# on for a non-`localhost` server. The daemon trusts it over plain HTTP through
# `insecure-registries` in /etc/docker/daemon.json.
#
# Why a registry on the NAS and not `localhost` on the deployer: when the thing
# that deploys IS the server (the CI runner lives on the NAS), Kamal's localhost
# registry opens a reverse SSH forward that binds :5555 on the server — the port
# its own registry already holds — and the deploy dies. A registry addressed by
# the NAS's LAN IP sidesteps the forward entirely.
registry:
  server: 192.168.1.7:5555
  username: kamal
  password:
    - KAMAL_REGISTRY_PASSWORD

# The NAS is amd64 and the Mac is arm64. Building on the NAS is native;
# cross-compiling with QEMU from the Mac works but is much slower.
builder:
  arch: amd64
  remote: ssh://gaston@192.168.1.7
  # The version the app shows is the tag this deploy was cut from, read here —
  # where there is still a git clone to read it from — and baked into the image.
  # An untagged checkout hands in nothing, and the app shows no version.
  args:
    VERSION: <%= `git describe --tags --abbrev=0 2>/dev/null`.strip %>

# root over SSH is denied on the NAS; gaston is in the docker group.
ssh:
  user: gaston

env:
  clear:
    MEDIA_ROOT: /mnt/data/multimedia
    BEETS_DATABASE: /mnt/data/beets/musiclibrary.db
    # Single process: the NAS has 8 cores and there's no concurrency to spread.
    SOLID_QUEUE_IN_PUMA: true
  secret:
    - RAILS_MASTER_KEY

# Music is mounted read-only under the SAME path as on the host, so a path
# stored in the catalog means the same thing inside and outside the container.
# The container runs as uid 1000, which on the NAS is gaston, the owner of the
# files.
volumes:
  - "/mnt/data/multimedia:/mnt/data/multimedia:ro"
  - "/mnt/data/beets/musiclibrary.db:/mnt/data/beets/musiclibrary.db:ro"
  - "mediateca_storage:/rails/storage"

aliases:
  import: app exec --reuse "bin/rails music:import"
  console: app exec --interactive --reuse "bin/rails console"
  logs: app logs -f
