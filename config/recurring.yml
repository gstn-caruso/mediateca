# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # A scan reads the tags of 1171 FLACs with ffprobe: a long minute. In the
  # small hours it doesn't steal CPU from anyone, and new music just shows up.
  scan_music:
    class: ScanMusicJob
    schedule: at 4am every day

  # A job that fails keeps retrying for hours and then gives up. A NAS whose
  # uplink is out for a whole weekend outlasts that — and the songs are still
  # sitting in the queue, still perfectly good, because Last.fm takes them late.
  # So something comes back for them, and keeps coming back.
  send_waiting_scrobbles:
    class: SweepScrobblesJob
    schedule: every 30 minutes

  # The records this house plays and does not have, gone and got. Three at a time,
  # heaviest want first: the list is thousands long and would be a hundred gigabytes
  # off the leash. It walks, and it gets there.
  chase_wanted_records:
    class: ChaseWantedRecordsJob
    schedule: every 30 minutes

  # And what became of them, so the clock on the library page has a number to show.
  watch_the_chase:
    class: WatchTheChaseJob
    schedule: every 2 minutes
